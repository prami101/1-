<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YORTUR QUEST</title>
<style>
:root{
  --gold:#d8b56a;
  --cream:#f4ead3;
  --ink:#16110b;
  --wood:#6c4b2a;
  --wood2:#8a6237;
  --stone1:#7c7b86;
  --stone2:#5f606d;
  --stone3:#444854;
  --ui:#101722;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:Georgia,serif;
  background:radial-gradient(circle at top,#324866 0%,#1a2637 45%,#0b1018 100%);
  color:var(--cream);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
#gameWrap{
  width:100vw;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}
#game{
  width:min(1240px,100%);
  height:min(800px,100dvh - 24px);
  background:
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0)),
    #101722;
  border:2px solid rgba(216,181,106,.35);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  position:relative;
  touch-action:none;
}
#game.goth-mode{
  border-color:rgba(188,188,208,.34);
  box-shadow:0 22px 64px rgba(0,0,0,.62);
}
#game.goth-mode .garden .sky,
#game.goth-mode .forest .sky,
#game.goth-mode .cave .sky,
#game.goth-mode .palace .sky{
  filter:brightness(.62) saturate(.78) hue-rotate(8deg);
}
#game.goth-mode .moon{
  opacity:.72;
  filter:blur(.5px) brightness(.82);
}
#game.goth-mode .mistLine{opacity:.4}
#game.goth-mode .brazier .flame{
  background:radial-gradient(circle at 50% 76%,#e7d6ff 0 24%,#8b59c5 42%,rgba(113,63,166,.22) 70%,transparent 76%);
}
#hud{
  position:absolute;top:0;left:0;right:0;min-height:74px;z-index:90;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;
  background:linear-gradient(180deg,rgba(8,10,14,.94),rgba(8,10,14,.60));
  border-bottom:1px solid rgba(216,181,106,.2);
  backdrop-filter: blur(4px);
}
.hud-left,.hud-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(216,181,106,.25);
  color:var(--cream);
  padding:7px 11px;
  border-radius:999px;
  font-size:13px;
  white-space:nowrap;
}
button{
  background:linear-gradient(180deg,#8c6940,#6c4c2a);
  color:#fff8e8;
  border:none;border-radius:999px;padding:9px 13px;
  cursor:pointer;font-weight:bold;box-shadow:0 6px 18px rgba(0,0,0,.18);
  transition:transform .12s ease,filter .12s ease;
}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px) scale(.985)}
.lang-toggle{
  background:linear-gradient(180deg,#d8b56a,#8b6a3e);
  color:var(--ink);
  border:1px solid rgba(255,255,255,.14);
  min-width:64px;
}
#world{position:absolute;inset:74px 0 0 0;overflow:hidden}
.level{position:absolute;inset:0;display:none}
.level.active{display:block}
.sky{position:absolute;inset:0;overflow:hidden}
.label{
  position:absolute;top:16px;width:100%;text-align:center;
  font-size:clamp(20px,2.7vw,28px);letter-spacing:1.2px;color:#f6e7c6;
  text-shadow:0 3px 12px rgba(0,0,0,.45);z-index:25;padding:0 18px;line-height:1.14;
}
.depth,.castleLine,.mountainLine,.mistLine,.stars,.moon{
  position:absolute;left:0;right:0;pointer-events:none;
}
.stars{top:0;bottom:45%;opacity:.7}
.stars::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 10% 18%,rgba(255,255,255,.9) 0 1px,transparent 2px),
    radial-gradient(circle at 22% 12%,rgba(255,255,255,.7) 0 1px,transparent 2px),
    radial-gradient(circle at 31% 24%,rgba(255,255,255,.65) 0 1px,transparent 2px),
    radial-gradient(circle at 54% 16%,rgba(255,255,255,.8) 0 1px,transparent 2px),
    radial-gradient(circle at 68% 10%,rgba(255,255,255,.7) 0 1px,transparent 2px),
    radial-gradient(circle at 83% 21%,rgba(255,255,255,.8) 0 1px,transparent 2px),
    radial-gradient(circle at 91% 14%,rgba(255,255,255,.7) 0 1px,transparent 2px);
}
.moon{
  top:28px;left:auto;right:72px;width:120px;height:120px;
  background:radial-gradient(circle at 35% 35%,rgba(255,248,220,.95) 0 18%,rgba(255,230,174,.35) 18%,transparent 45%);
  filter:blur(.2px);
  opacity:.9;
}
.castleLine{bottom:190px;height:160px;opacity:.45}
.castleLine::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,transparent 0 7%,#23283a 7% 10%,transparent 10% 17%,#252a3d 17% 24%,transparent 24% 31%,#21263a 31% 36%,transparent 36% 48%,#2a2f44 48% 54%,transparent 54% 67%,#23293d 67% 74%,transparent 74% 84%,#252a3e 84% 91%,transparent 91%),
    linear-gradient(#303650,#23283a);
  clip-path:polygon(0 100%,0 75%,4% 75%,4% 58%,6% 58%,6% 78%,10% 78%,10% 65%,12% 65%,12% 82%,18% 82%,18% 60%,20% 60%,20% 74%,24% 74%,24% 86%,31% 86%,31% 67%,33% 67%,33% 82%,36% 82%,36% 72%,40% 72%,40% 88%,48% 88%,48% 62%,50% 62%,50% 76%,54% 76%,54% 90%,66% 90%,66% 70%,69% 70%,69% 83%,74% 83%,74% 58%,77% 58%,77% 86%,84% 86%,84% 68%,87% 68%,87% 80%,91% 80%,91% 72%,94% 72%,94% 100%,100% 100%);
}
.mountainLine{bottom:205px;height:170px;opacity:.36}
.mountainLine::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,#2b3348,#1b2131);
  clip-path:polygon(0 100%,0 62%,9% 45%,18% 58%,29% 35%,40% 61%,52% 31%,62% 55%,76% 27%,88% 60%,100% 40%,100% 100%);
}
.mistLine{bottom:160px;height:120px;opacity:.28;filter:blur(8px)}
.mistLine::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 10% 60%,rgba(255,255,255,.35) 0 18%,transparent 20%),
    radial-gradient(circle at 24% 68%,rgba(255,255,255,.28) 0 16%,transparent 18%),
    radial-gradient(circle at 52% 60%,rgba(255,255,255,.22) 0 18%,transparent 20%),
    radial-gradient(circle at 74% 68%,rgba(255,255,255,.25) 0 18%,transparent 20%),
    radial-gradient(circle at 90% 60%,rgba(255,255,255,.23) 0 16%,transparent 18%);
}
.forest .sky{
  background:
    radial-gradient(circle at 50% 16%,rgba(255,239,195,.18),transparent 18%),
    linear-gradient(180deg,#5f7f6f 0%,#304738 50%,#161e1a 100%);
}
.garden .sky{
  background:
    radial-gradient(circle at 50% 14%,rgba(255,243,198,.22),transparent 20%),
    linear-gradient(180deg,#8a7aa1 0%,#544d73 50%,#232638 100%);
}
.cave .sky{
  background:
    radial-gradient(circle at 50% 12%,rgba(189,214,255,.08),transparent 12%),
    linear-gradient(180deg,#32405d 0%,#1c2430 58%,#0e1219 100%);
}
.palace .sky{
  background:
    radial-gradient(circle at 50% 15%,rgba(255,229,182,.18),transparent 20%),
    linear-gradient(180deg,#6f78a9 0%,#404a74 58%,#1d2238 100%);
}
.ground{
  position:absolute;left:0;right:0;bottom:0;height:180px;
  border-top:1px solid rgba(255,255,255,.08);overflow:hidden;z-index:8;
}
.ground::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 4% 76%,#7b818e 0 26px,transparent 27px),
    radial-gradient(circle at 12% 83%,#686d79 0 28px,transparent 29px),
    radial-gradient(circle at 22% 74%,#8a8f9b 0 24px,transparent 25px),
    radial-gradient(circle at 33% 83%,#707582 0 30px,transparent 31px),
    radial-gradient(circle at 45% 74%,#848996 0 26px,transparent 27px),
    radial-gradient(circle at 57% 82%,#676d79 0 28px,transparent 29px),
    radial-gradient(circle at 69% 75%,#8a8f9b 0 24px,transparent 25px),
    radial-gradient(circle at 80% 83%,#707582 0 30px,transparent 31px),
    radial-gradient(circle at 93% 76%,#7b818e 0 26px,transparent 27px);
  opacity:.95;
}
.ground::after{
  content:"";position:absolute;inset:10px 0 0 0;
  background:
    radial-gradient(circle at 8% 30%,rgba(255,255,255,.08) 0 8px,transparent 9px),
    radial-gradient(circle at 18% 46%,rgba(0,0,0,.14) 0 10px,transparent 11px),
    radial-gradient(circle at 28% 28%,rgba(255,255,255,.07) 0 8px,transparent 9px),
    radial-gradient(circle at 40% 50%,rgba(0,0,0,.14) 0 12px,transparent 13px),
    radial-gradient(circle at 60% 34%,rgba(255,255,255,.07) 0 8px,transparent 9px),
    radial-gradient(circle at 71% 52%,rgba(0,0,0,.14) 0 12px,transparent 13px),
    radial-gradient(circle at 86% 34%,rgba(255,255,255,.07) 0 8px,transparent 9px);
  opacity:.75;
}
.garden .ground{background:linear-gradient(180deg,#82879a 0%,#606574 100%)}
.forest .ground{background:linear-gradient(180deg,#7a8381 0%,#57615f 100%)}
.cave .ground{background:linear-gradient(180deg,#686f7c 0%,#484d59 100%)}
.palace .ground{background:linear-gradient(180deg,#8d8a94 0%,#64616d 100%)}
.roadPerspective{
  position:absolute;left:50%;bottom:112px;transform:translateX(-50%);
  width:640px;height:180px;z-index:9;pointer-events:none;opacity:.75;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0));
  clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);
}
.roadPerspective::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 8%,rgba(255,255,255,.12) 0 4px,transparent 5px),
    radial-gradient(circle at 41% 24%,rgba(255,255,255,.10) 0 5px,transparent 6px),
    radial-gradient(circle at 58% 25%,rgba(255,255,255,.10) 0 5px,transparent 6px),
    radial-gradient(circle at 28% 48%,rgba(255,255,255,.08) 0 7px,transparent 8px),
    radial-gradient(circle at 71% 48%,rgba(255,255,255,.08) 0 7px,transparent 8px),
    radial-gradient(circle at 18% 74%,rgba(255,255,255,.07) 0 8px,transparent 9px),
    radial-gradient(circle at 82% 74%,rgba(255,255,255,.07) 0 8px,transparent 9px);
}
.platform,.door,.npcWrap,.sign,.hazard,.plant,.column,.lantern,.flower,.snowdrop,.tree,.occluder,.brazier,.rock,.grassTuft,.collectible,.ambience-bat,.ambience-spider,.ambience-vampire,.ambience-web,.end-goth-girl{
  position:absolute;z-index:12;
}
.platform{
  background:linear-gradient(180deg,var(--wood2),var(--wood));
  border:2px solid rgba(255,255,255,.08);
  border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.2);
}
.tree{width:120px;height:190px;z-index:10;pointer-events:none}
.tree .trunk{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:22px;height:85px;border-radius:12px;
  background:linear-gradient(180deg,#6b4a2e,#3d2917);
}
.tree .crown{
  position:absolute;bottom:55px;left:50%;transform:translateX(-50%);
  width:114px;height:112px;border-radius:50%;
  background:
    radial-gradient(circle at 35% 38%,#8ab47b 0 20%,transparent 22%),
    radial-gradient(circle at 67% 34%,#739d69 0 22%,transparent 24%),
    radial-gradient(circle at 50% 60%,#62885c 0 24%,transparent 26%),
    radial-gradient(circle at 23% 63%,#54754e 0 19%,transparent 21%),
    radial-gradient(circle at 77% 64%,#5b7e54 0 18%,transparent 20%),
    radial-gradient(circle at 50% 50%,#6d9b63 0 35%,transparent 37%);
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.20));
}
.tree.small{transform:scale(.78);opacity:.82}
.flower{width:22px;height:24px;pointer-events:none;z-index:14}
.flower::before{
  content:"";position:absolute;left:10px;bottom:0;width:2px;height:14px;background:#6a925d
}
.flower::after{
  content:"";position:absolute;left:0;top:0;width:22px;height:12px;
  background:
    radial-gradient(circle at 6px 6px,#cfd8ff 0 4px,transparent 5px),
    radial-gradient(circle at 11px 3px,#9caeff 0 4px,transparent 5px),
    radial-gradient(circle at 16px 7px,#d9e1ff 0 4px,transparent 5px);
}
.snowdrop{width:24px;height:28px;pointer-events:none;z-index:14}
.snowdrop::before{
  content:"";position:absolute;left:11px;bottom:0;width:2px;height:18px;background:#6d975f;border-radius:2px;
}
.snowdrop::after{
  content:"";position:absolute;left:4px;top:7px;width:18px;height:14px;
  background:
    radial-gradient(circle at 6px 6px,#fffef8 0 5px,transparent 5.5px),
    radial-gradient(circle at 11px 9px,#f6fff8 0 4px,transparent 4.5px),
    radial-gradient(circle at 14px 6px,#fffef8 0 5px,transparent 5.5px);
  filter:drop-shadow(0 1px 1px rgba(255,255,255,.35));
  transform:rotate(12deg);
}
.collectible{
  width:28px;height:28px;display:grid;place-items:center;z-index:19;
  font-size:22px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.28));
  animation:floaty 1.7s ease-in-out infinite;
}
.collectible::before{content:none}
.collectible.collected{display:none}
.rock{
  width:58px;height:34px;pointer-events:none;z-index:13;
  background:linear-gradient(180deg,#9aa0ac 0%,#6d7380 65%,#4b505b 100%);
  border-radius:58% 42% 36% 64% / 62% 58% 42% 38%;
  box-shadow:0 8px 14px rgba(0,0,0,.16), inset 0 4px 8px rgba(255,255,255,.08);
}
.rock.small{transform:scale(.72);opacity:.9}
.rock::before{
  content:"";position:absolute;left:10px;top:8px;width:10px;height:5px;border-radius:99px;
  background:rgba(255,255,255,.18);transform:rotate(-12deg);
}
.grassTuft{
  width:34px;height:28px;pointer-events:none;z-index:14;
}
.grassTuft::before,.grassTuft::after{
  content:"";position:absolute;bottom:0;left:0;right:0;height:28px;
  background:
    linear-gradient(75deg,transparent 0 43%,#7ca26c 43% 49%,transparent 49% 100%),
    linear-gradient(92deg,transparent 0 46%,#6a925c 46% 52%,transparent 52% 100%),
    linear-gradient(108deg,transparent 0 38%,#8ab47b 38% 44%,transparent 44% 100%),
    linear-gradient(122deg,transparent 0 50%,#5d8452 50% 56%,transparent 56% 100%);
  border-radius:0 0 8px 8px;
}
.grassTuft::after{transform:scaleX(.78) translateX(6px);opacity:.9}
.column{
  width:28px;height:138px;background:linear-gradient(180deg,#c7bca4,#8e8372);
  border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.18);opacity:.88;
}
.column::before{
  content:"";position:absolute;top:-8px;left:-6px;width:40px;height:13px;background:#ddd0b5;border-radius:8px;
}
.lantern{
  width:22px;height:38px;background:linear-gradient(180deg,#ddb76f,#8b6432);
  border-radius:8px 8px 10px 10px;box-shadow:0 0 22px rgba(255,216,138,.18);opacity:.9;
}
.lantern::before{
  content:"";position:absolute;top:-12px;left:9px;width:4px;height:14px;background:#d8b56a;
}
.brazier{width:34px;height:58px;z-index:16}
.brazier .bowl{
  position:absolute;bottom:0;left:5px;width:24px;height:12px;border-radius:0 0 12px 12px;
  background:linear-gradient(180deg,#70553a,#3d2a1b);
}
.brazier .stand{
  position:absolute;left:16px;bottom:10px;width:3px;height:22px;background:#836749;
}
.brazier .flame{
  position:absolute;left:8px;bottom:10px;width:18px;height:28px;
  background:radial-gradient(circle at 50% 76%,#ffd27a 0 25%,#ff8f3f 42%,rgba(255,108,43,.2) 70%,transparent 76%);
  clip-path:polygon(50% 0%,74% 25%,100% 58%,76% 100%,50% 82%,25% 100%,0 58%,27% 25%);
  animation:flameFlicker .75s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(255,154,61,.6));
}
@keyframes flameFlicker{
  0%,100%{transform:scaleY(1) translateY(0)}
  50%{transform:scaleY(1.12) translateY(-2px)}
}
.ambience-bat{
  width:38px;height:16px;opacity:.72;pointer-events:none;z-index:11;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
}
.ambience-bat::before{
  content:"";position:absolute;inset:0;background:#0d0d15;
  clip-path:polygon(0 60%,16% 30%,35% 58%,50% 20%,65% 58%,84% 30%,100% 60%,76% 52%,50% 100%,24% 52%);
}
.ambience-spider{
  width:14px;height:14px;border-radius:50%;background:#0d0e14;pointer-events:none;z-index:11;
}
.ambience-spider::before,.ambience-spider::after{
  content:"";position:absolute;inset:-5px;
  background:
    linear-gradient(45deg,transparent 46%,#1b1c24 46% 49%,transparent 49%),
    linear-gradient(135deg,transparent 46%,#1b1c24 46% 49%,transparent 49%);
}
.ambience-vampire{
  width:38px;height:88px;pointer-events:none;z-index:11;opacity:.62;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.28));
}
.ambience-vampire::before{
  content:"";position:absolute;left:10px;top:0;width:18px;height:18px;border-radius:50%;background:#f0e3da;
  box-shadow:0 8px 0 -6px #5b0f1d;
}
.ambience-vampire::after{
  content:"";position:absolute;left:0;top:14px;width:38px;height:74px;background:linear-gradient(180deg,#24111a,#09070b);
  clip-path:polygon(50% 0%,82% 10%,100% 100%,0 100%,18% 10%);
}
.ambience-web{
  width:96px;height:96px;border-radius:50%;opacity:.34;pointer-events:none;z-index:11;
}
.ambience-web::before,.ambience-web::after{
  content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(228,228,240,.22);
}
.ambience-web::after{inset:12px}
.ambience-web .line{
  position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(228,228,240,.2);transform-origin:center;
}
.ambience-web .line:nth-child(2){transform:rotate(30deg)}
.ambience-web .line:nth-child(3){transform:rotate(60deg)}
.ambience-web .line:nth-child(4){transform:rotate(90deg)}
.ambience-web .line:nth-child(5){transform:rotate(120deg)}
.ambience-web .line:nth-child(6){transform:rotate(150deg)}
.end-goth-girl{
  position:absolute;left:412px;bottom:10px;width:118px;height:196px;z-index:15;
}
.end-goth-girl .hair{
  position:absolute;left:24px;top:6px;width:70px;height:84px;border-radius:34px;
  background:linear-gradient(180deg,#b56042 0%,#8a3a24 42%,#451311 100%);
  box-shadow:inset 0 -10px 0 rgba(54,13,12,.22);
}
.end-goth-girl .head{
  position:absolute;left:38px;top:20px;width:42px;height:50px;border-radius:48% 48% 52% 52%;
  background:#f3e8df;box-shadow:inset 0 -4px 0 rgba(0,0,0,.05);
}
.end-goth-girl .brow{
  position:absolute;top:35px;width:9px;height:2px;background:#3a281f;border-radius:3px;
}
.end-goth-girl .brow.left{left:46px;transform:rotate(-8deg)}
.end-goth-girl .brow.right{left:62px;transform:rotate(8deg)}
.end-goth-girl .eye{
  position:absolute;top:39px;width:5px;height:5px;background:#5aa3ff;border-radius:50%;
  box-shadow:0 0 0 2px rgba(0,0,0,.86),0 0 8px rgba(90,163,255,.28);
}
.end-goth-girl .eye.left{left:49px}
.end-goth-girl .eye.right{left:66px}
.end-goth-girl .nose{
  position:absolute;left:58px;top:43px;width:3px;height:10px;border-radius:3px;background:rgba(136,103,90,.28);
}
.end-goth-girl .mouth{
  position:absolute;left:54px;top:56px;width:12px;height:5px;border-bottom:2px solid #6f2a36;border-radius:0 0 10px 10px;
}
.end-goth-girl .dress{
  position:absolute;left:20px;top:64px;width:78px;height:104px;
  background:linear-gradient(180deg,#181924,#05050a);
  clip-path:polygon(50% 0%,84% 12%,100% 100%,0 100%,16% 12%);
}
.end-goth-girl .arm{position:absolute;top:82px;width:11px;height:44px;background:#f0ddd0;border-radius:10px}
.end-goth-girl .arm.left{left:18px;transform:rotate(12deg)}
.end-goth-girl .arm.right{left:88px;transform:rotate(-14deg)}
.end-goth-girl .leg{position:absolute;bottom:0;width:10px;height:46px;background:#090a0f;border-radius:8px}
.end-goth-girl .leg.left{left:47px}.end-goth-girl .leg.right{left:63px}

.win-panel{
  position:relative;
  overflow:hidden;
  padding-bottom:244px;
}
.end-tableau{
  position:absolute;left:16px;right:16px;bottom:12px;height:220px;overflow:hidden;
  border-radius:18px;border:1px solid rgba(216,181,106,.16);
  background:
    radial-gradient(circle at 50% 18%,rgba(157,116,255,.14),transparent 28%),
    linear-gradient(180deg,rgba(10,12,20,.15),rgba(4,4,8,.52)),
    linear-gradient(180deg,#1a1923 0%,#0a0a11 56%,#050509 100%);
}
.tableau-glow{
  position:absolute;inset:auto 0 54px 0;height:120px;
  background:

<div id="gameWrap">
  <div id="game" tabindex="0" aria-label="Yortur Quest game">

      <div class="hair-back"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="goatee"></div>
      </div>
      <div class="hair-front"></div>
      <div class="neck"></div>
      <div class="torso"></div>
      <div class="shirt"></div>
      <div class="waist-belt"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="hurdy">
        <div class="wheel"></div><div class="keys"></div><div class="strings s1"></div><div class="strings s2"></div><div class="crank"></div>
      </div>
      <div class="jump-wing-left"></div>
      <div class="jump-wing-right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

    <div id="mobileControls" aria-label="Touch controls">
      <div class="controlCluster dpad">
        <div class="spacer"></div>
        <button class="controlBtn" data-key="ArrowUp" aria-label="Jump">▲</button>
        <div class="spacer"></div>
        <button class="controlBtn" data-key="ArrowLeft" aria-label="Move left">◀</button>
        <div class="spacer"></div>
        <button class="controlBtn" data-key="ArrowRight" aria-label="Move right">▶</button>
        <div class="spacer"></div>
        <button class="controlBtn" data-key="ArrowDown" aria-label="Down">▼</button>
        <div class="spacer"></div>
      </div>
      <div class="controlCluster actionsPad">
        <button class="controlBtn action" data-key="e" aria-label="Interact">E</button>
        <button class="controlBtn action" data-key=" " aria-label="Jump">⤒</button>
      </div>
    </div>

    <div id="toast"></div>

    <div id="message">
      <div class="panel">
        <h2 id="messageTitle">Message</h2>
        <p id="messageText"></p>
        <div class="controls"><button id="messageOk">Continue</button></div>
      </div>
    </div>

    <div id="quizModal">
      <div class="panel">
        <h2 id="quizTitle">Instrument question</h2>
        <p id="quizQuestion"></p>
        <div id="answers"></div>
      </div>
    </div>

    <div id="instrumentModal">
      <div class="panel" id="instrumentPanel">
        <h2 id="instrumentTitle">Play the melody</h2>

        <div id="instrumentBoard"></div>
        <div class="hitsRow" id="targetMelody"></div>
        <div class="hitsRow" id="playerMelody"></div>
        <div class="controls">
          <button id="playTargetBtn">Listen melody</button>
          <button id="clearMelodyBtn">Clear</button>
        </div>
        <p class="small" id="instrumentHint"></p>
      </div>
    </div>

    <div id="startScreen">
      <div class="panel">
        <h1 id="startTitle">YORTUR QUEST</h1>
        <p id="startText"></p>
        <p class="small" id="startSmall"></p>
        <div class="controls">
          <button id="startBtn">Begin adventure</button>
          <button id="gothBtn">Goth Mode</button>
        </div>
      </div>
    </div>

          <div class="tableau-dragon"></div>
          <div class="tableau-treasure"></div>
          <div class="tableau-treasure-rich"></div>
          <div class="treasure-spark s1"></div>
          <div class="treasure-spark s2"></div>
          <div class="treasure-spark s3"></div>

          <div class="tableau-bard">
            <div class="wing-left"></div>

            <div class="mini-crown"></div>
            <div class="cape"></div><div class="hair-back"></div>
            <div class="head"><div class="hairline"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div><div class="goatee"></div></div>
            <div class="hair-front"></div><div class="neck"></div><div class="torso"></div><div class="shirt"></div><div class="waist-belt"></div>
            <div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div>
          </div>

          <div class="tableau-princess">
            <div class="wing-left"></div>
            <div class="wing-right"></div>
            <div class="mini-crown"></div>
            <div class="cape"></div><div class="hair-back"></div>
            <div class="head"><div class="hairline"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div>
            <div class="hair-front"></div><div class="neck"></div><div class="torso"></div><div class="shirt"></div><div class="waist-belt"></div>
            <div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div>
          </div>

          <div class="crown-aura"></div>
          <div class="crown-mark"></div>

          <div class="tableau-floor"></div>

        <div class="ending-card">

        <div class="controls" id="endingControls">
          <button id="endingNextBtn">Continue</button>
          <button id="playFinalBtn" style="display:none">Play final melody</button>
          <button id="playAgainBtn" style="display:none">Play again</button>
        </div>
      </div>
    </div>
  </div>
