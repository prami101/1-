<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yortur – Final Demo</title>
<style>
body{
  margin:0;
  background:#0b0b12;
  color:#e8e0d0;
  font-family:Georgia,serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
#game{
  width:900px;
  height:500px;
  background:linear-gradient(#1a1a2a,#050509);
  border:2px solid #6a5a8a;
  border-radius:20px;
  position:relative;
  overflow:hidden;
}
.hero, .princess{
  position:absolute;
  bottom:60px;
  width:60px;
  height:120px;
  background:#222;
  border-radius:20px;
}
.hero{ left:300px; background:#111;}
.princess{ left:500px; background:#2a1a2a;}

.crown{
  position:absolute;
  top:-20px;
  left:10px;
  width:40px;
  height:20px;
  background:gold;
  clip-path:polygon(0% 100%,20% 40%,40% 100%,60% 40%,80% 100%,100% 40%,100% 100%);
}

.dragon{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  width:300px;
  height:100px;
  background:linear-gradient(#300,#100);
  opacity:0.5;
  clip-path:polygon(0% 80%,20% 40%,40% 70%,60% 20%,80% 60%,100% 80%);
}

.treasure{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:200px;
  height:40px;
  background:gold;
  border-radius:20px;
  box-shadow:0 0 20px gold;
}

.text{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  font-size:22px;
  opacity:0;
  transition:1s;
}
.show{opacity:1;}
</style>
</head>
<body>

<div id="game">
  <div class="dragon"></div>
  <div class="hero"><div class="crown"></div></div>
  <div class="princess"></div>
  <div class="treasure"></div>
  <div id="text" class="text">nothing was lost</div>
</div>

<script>
let t = document.getElementById("text");

setTimeout(()=>{ t.classList.add("show"); },1000);
setTimeout(()=>{ t.innerText="memory returned"; },3000);
setTimeout(()=>{ t.innerText="you carry it now"; },5000);

// simple final sound
const ctx = new (window.AudioContext||window.webkitAudioContext)();
function play(){
  let o = ctx.createOscillator();
  let g = ctx.createGain();
  o.type="sawtooth";
  o.frequency.value=220;
  g.gain.value=0.05;
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime+2);
}
play();
</script>

</body>
</html>
